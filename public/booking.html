<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>填写预约信息 · 预约管理</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html"><span class="brand-logo">预约管理</span><span class="brand-name">韩签代预约</span></a>
      <nav class="main-nav"><a href="index.html">首页</a><a href="index.html#region">立即预约</a><a href="recover.html">恢复订单</a><a href="help.html">帮助中心</a></nav>
    </div>
  </header>

  <main class="form-wrap">
    <div class="container-narrow">
      <div class="form-card">
        <h1 id="regionTitle">预约信息</h1>
        <p class="form-sub">填写申请人信息，提交后进入处理流程；上海中心支持自动处理，其他领区由运营人员处理。信息仅用于本人预约，我们不索取官网账号密码。</p>
        <div class="form-region-tags" id="regionProvinces"></div>

        <form id="bookingForm" novalidate>
          <div class="field">
            <label>申请人姓名 <span class="hint">与护照一致</span></label>
            <input name="name" type="text" placeholder="请输入姓名" autocomplete="off" />
          </div>
          <div class="field">
            <label>手机号码 <span class="hint">用于接收官方验证码通知</span></label>
            <input name="phone" type="tel" placeholder="11 位手机号" maxlength="11" autocomplete="off" />
          </div>
          <div class="field">
            <label>与签证申请人的关系</label>
            <select name="relation"><option>本人</option><option>父母</option><option>子女</option><option>配偶</option><option>其他</option></select>
          </div>
          <div class="field">
            <label>计划出境日期</label>
            <input name="exitDate" type="date" />
          </div>

          <div class="field">
            <label>可接受的预约日期范围 <span class="hint">留空为不限。系统只约此范围内的名额</span></label>
            <div class="date-range">
              <input name="apptEarliest" type="date" aria-label="最早可接受日期" />
              <span class="date-range-sep">至</span>
              <input name="apptLatest" type="date" aria-label="最晚可接受日期" />
            </div>
            <p class="hint" style="margin:8px 0 0">例：只想约 7/13 之前的名额，就把"最晚"设为 2026-07-13，之后放出的名额不会为您预约。</p>
          </div>

          <div id="excludeDates"></div>
          <div class="field">
            <button type="button" class="btn-sm" id="addExclude" style="padding:9px 16px">＋ 排除某个日期</button>
            <span class="hint">这些天即使有名额也不预约（如占用工作日、已有安排）</span>
          </div>

          <div id="extraApplicants"></div>
          <div class="field">
            <button type="button" class="btn-sm" id="addApplicant" style="padding:9px 16px">＋ 添加同行申请人</button>
            <span class="hint">最多 4 名一同预约</span>
          </div>

          <div class="form-error" id="formError"></div>
          <button type="submit" class="btn-primary-block" id="submitBtn">提交预约</button>
          <p class="form-legal">提交即表示同意<a href="terms.html" style="border-bottom:1px solid currentColor">《服务条款》</a>与<a href="privacy.html" style="border-bottom:1px solid currentColor">《隐私政策》</a>。提交后可在订单页查看进度，预约结果以官网核对为准。</p>
        </form>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
  <script src="page-init.js"></script>
</body>
</html>
