<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>恢复订单 · 预约管理</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html"><span class="brand-logo">预约管理</span><span class="brand-name">韩签代预约</span></a>
      <nav class="main-nav"><a href="index.html">首页</a><a href="index.html#region">立即预约</a><a href="recover.html">恢复订单</a><a href="help.html">帮助中心</a></nav>
    </div>
  </header>

  <main class="form-wrap">
    <div class="container-narrow">
      <div class="form-card">
        <h1>找回预约订单</h1>
        <p class="form-sub">别担心，订单不会丢。用下单时的信息即可找回订单页链接，继续查看进度。请核对姓名与手机号是否与提交时一致。</p>


        <form id="recoverForm" novalidate>
          <div class="field" id="fieldName">
            <label>下单姓名 <span class="hint">主申请人姓名，与提交时一致</span></label>
            <input name="name" type="text" placeholder="请输入下单时填写的姓名" autocomplete="off" />
          </div>
          <div class="field">
            <label>手机号码 <span class="hint">下单时填写的 11 位手机号</span></label>
            <input name="phone" type="tel" placeholder="11 位手机号" maxlength="11" autocomplete="off" />
          </div>

          <div class="form-error" id="formError"></div>
          <button type="submit" class="btn-primary-block" id="recoverBtn">找回订单</button>
          <p class="form-legal">查询需姓名与手机号同时匹配，仅返回脱敏后的订单信息。</p>
        </form>

        <div class="recover-results" id="recoverResults"></div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-copy">© 2026 预约管理 · 韩国签证（上海 / 广州 / 北京 / 西安）自动预约协助。本站为独立第三方服务，与使领馆及签证中心无关联。</div>
      <nav class="footer-links"><a href="recover.html">恢复订单</a><a href="help.html">帮助中心</a><a href="terms.html">服务条款</a><a href="privacy.html">隐私政策</a></nav>
    </div>
  </footer>

  <script src="app.js"></script>
  <script src="page-init.js"></script>
</body>
</html>
